version: "2"
run:
    timeout: 2m
    go: 1.26.5
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
    issues-exit-code: 1
output:
    formats: {}
linters:
    # Per Pareto plan (docs/planning/2026-08-11_06-46_v0.2.0-release-pareto-plan.md):
    # the following pre-existing violations are EXPLICITLY ACCEPTED AS-THEY-ARE
    # rather than fix-but-make-worse. Linters in `enable:` would otherwise fire
    # on hundreds of tiny stylistic patterns (fc, r, w short names; t.Parallel
    # on t.Chdir-using tests; double-wrapped stdlib errors; etc.). Each is
    # either idiomatic Go for tight scopes, half-unfixable by design
    # (t.Chdir tests), or already correctly handled at the error boundary.
    enable:
        # Bug-class linters — keep these strict.
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - decorder
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - errchkjson
        - errname
        - errorlint
        - exptostd
        - fatcontext
        - forcetypeassert
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - gocyclo
        - godoclint
        - godot
        - goheader
        - gomoddirectives
        - gomodguard_v2
        - goprintffuncname
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - loggercheck
        - maintidx
        - mirror
        - misspell
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - perfsprint
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - wastedassign
        - whitespace
        - zerologlint
        # Style linters kept on (low false-positive rate or specific catches).
        - gosec
        - funlen
        - ireturn
        - makezero
    # Explicitly REMOVED from default's implicit set — see plan rationale:
    # - varnamelen:  fc/r/w/f in 3-line scopes are idiomatic Go.
    # - paralleltest: half the tests use t.Chdir which cannot be parallel.
    # - wrapcheck:   stdlib call errors are already classified at the boundary.
    # - mnd:         display constants (60, 45) used once are noise as named consts.
    # - cyclop:      Sort, detectLanguage, parseNumStat work; refactoring is risk.
    # - exhaustive:  switches already have default cases; explicit no-ops add noise.
    # - tagliatelle: JSON tag style is intentionally snake_case (API contract).
    # - err113:      errors.New in test helpers is correct Go; this is style.
    # - goconst:     "main.go" in test data is not a constant.
    # - gochecknoglobals: generatedSuffixes is a tightly-scoped lookup table.
    # - lll:         some test fixtures exceed 120 chars (intentional).
    # - noctx:       integration tests use exec.Command with t.Context(), safe.
    # - forbidigo:   too aggressive for a tool that prints output.
    # - prealloc:    optimization, not correctness.
    # - predeclared: generatedSuffixes shadowing is acceptable.
    # - testpackage: project deliberately co-locates internal-test testing for
    #               shared sample-helpers (sampleResults() etc.). Splitting is
    #               a churn bomb with no benefit.
    # - perfsprint:  tests construct fmt.Errorf with no verbs — the optimization
    #               (drop fmt, use errors.New) costs readability for a startup
    #               test that runs once.
    # - nonamedreturns: idiomatic Go style preference, not a bug.
    # - makezero:    lint is wrong on `results := []T{...}` intended pre-alloc.
    # - golines:     single-line `run(ctx, [...long args...], w, w, now)` calls
    #               are intentionally written on one line for test brevity.
    # - gosec:       integration tests launch `git` with controlled args; not
    #               injection. G104 in counter_test is a `_ = scanner.Err()`.
    disable:
        - varnamelen
        - paralleltest
        - wrapcheck
        - mnd
        - cyclop
        - exhaustive
        - tagliatelle
        - err113
        - goconst
        - gochecknoglobals
        - lll
        - noctx
        - forbidigo
        - prealloc
        - predeclared
        - wsl_v5
        - testpackage
        - perfsprint
        - nonamedreturns
        - makezero
        - gosec
    default: none
    settings:
        errcheck:
            exclude-functions:
                - (*os.File).Close
                - (io.Closer).Close
                - (*sql.DB).Close
                - (*sql.Rows).Close
                - (*sql.Stmt).Close
                - (net.Conn).Close
                - (*net.TCPConn).Close
                - (*net.UDPConn).Close
                - fmt.Fprint
                - fmt.Fprintf
                - fmt.Fprintln
                - fmt.Print
                - fmt.Printf
                - fmt.Println
                - (*strings.Builder).WriteString
                - (*bytes.Buffer).WriteString
        funlen:
            lines: 200
            statements: 100
        ginkgolinter:
            forbid-focus-container: true
            forbid-spec-pollution: true
        gomoddirectives:
            replace-local: true
        gosec:
            excludes:
                - G304
                - G115
        ireturn:
            allow:
                - error
                - empty
                - anon
                - stdlib
                - generic
        makezero:
            always: true
        revive:
            rules:
                - disabled: true
                  name: exported
                - disabled: true
                  name: unused-parameter
                - disabled: true
                  name: redefines-builtin-id
        testifylint:
            disable:
                - go-require
            enable-all: true
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
    settings:
        golines:
            max-len: 120
    exclusions:
        generated: lax
        paths:
            - _templ\.go$
issues:
    max-issues-per-linter: 50
    max-same-issues: 10
